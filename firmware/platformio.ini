; HomeMind TaskFlow controller firmware (pfn.v1, device-registry v4)
;   pio run -e esp32dev      CTRL-ESP32-ACT-01   (servos + fan)
;   pio run -e nodemcuv2     CTRL-ESP8266-LED-01 (indicator LEDs)
;   pio test -e native       unit tests of lib/hm_device and lib/hm_axis on the PC (Unity)
;   pio run -e native        PC CLI used by tools/check_messages.py
;   pio run -e teensy41_axis doll axis controller (1 stepper + home sensor), Teensy 4.1, standalone
;   pio run -e esp32_axis    same doll axis controller on an ESP32 DevKit (board undecided)
; Wi-Fi + broker address: include/hm_site_network.h (committed, user 2026-10-25).
; MQTT passwords: include/secrets.h (gitignored), template include/secrets.h.example.

[platformio]
default_envs = esp32dev, nodemcuv2

[common]
build_flags =
  -DARDUINOJSON_USE_LONG_LONG=1
  -DARDUINOJSON_ENABLE_COMMENTS=0
lib_deps_json = bblanchon/ArduinoJson@7.2.1
lib_deps_mqtt = 256dpi/MQTT@2.5.2

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_src_filter = +<esp32_actuator/>
build_flags = ${common.build_flags} -DHM_BOARD_ESP32_ACT=1
lib_deps =
  ${common.lib_deps_json}
  ${common.lib_deps_mqtt}
monitor_speed = 115200
upload_speed = 921600

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_src_filter = +<esp8266_led/>
build_flags = ${common.build_flags} -DHM_BOARD_ESP8266_LED=1
lib_deps =
  ${common.lib_deps_json}
  ${common.lib_deps_mqtt}
monitor_speed = 115200
upload_speed = 460800

[env:native]
platform = native@1.2.1
; Windows has no host compiler by default: use PlatformIO's MinGW package (added to PATH by
; tools/native_toolchain.py). On Linux/macOS the system gcc/clang is used.
platform_packages = platformio/toolchain-gccmingw32@1.50100.0
extra_scripts = pre:tools/native_toolchain.py
build_src_filter = +<native_cli/>
build_flags = ${common.build_flags} -std=gnu++11 -Wall -Wextra -DHM_NATIVE=1
lib_deps = ${common.lib_deps_json}
lib_ignore = hm_runtime
test_framework = unity
test_build_src = no

; Doll axis controller (src/doll_axis + lib/hm_axis): USB-serial line protocol, no Wi-Fi/MQTT and no
; pfn.v1 contract (HomeMind integration undecided). Pins/mechanics: include/doll_axis_config.h.
[env:teensy41_axis]
platform = teensy@5.0.0
board = teensy41
framework = arduino
build_src_filter = +<doll_axis/>
build_flags = -DHM_BOARD_TEENSY41_AXIS=1
lib_ignore = hm_device, hm_runtime
monitor_speed = 115200

[env:esp32_axis]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_src_filter = +<doll_axis/>
build_flags = -DHM_BOARD_ESP32_AXIS=1
lib_ignore = hm_device, hm_runtime
monitor_speed = 115200
upload_speed = 921600
