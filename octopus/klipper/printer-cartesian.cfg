# CTRL-OCTOPUS-01 (BTT Octopus V1.1 + Klipper on NODE-RPI4-02). Variant A: G-code (G0 X.. Y..).
# Pins: docs/handoff/reference/electrical-harness-plan.md (confirmed wiring; do not change here).
#   MOTOR0 = X  MOTOR-XY-X-01  STEP PF13 DIR PF12 EN PF14 UART PC4   SENSOR-HOME-X-01 J27 PG6
#   MOTOR1 = Y  MOTOR-XY-Y-01  STEP PG0  DIR PG1  EN PF15 UART PD11  SENSOR-HOME-Y-01 J29 PG9
# Klipper's cartesian kinematics needs a Z stepper: it is declared on the empty MOTOR2 slot
# (nothing connected) with homing disabled by a fixed position. Variant B (printer-manual-stepper.cfg)
# avoids that if moves are only issued by macros/scripts. Choosing A or B = open decision
# (system-architecture 9-4 "Octopus 시연 이동 방식").
#
# VALUES TO CONFIRM ON THE MODEL (marked TODO): MCU serial id, endstop polarity, travel lengths,
# rotation_distance (GT2 belt + pulley; the BOM marks the GT2 belt "not purchased"), motor current.

[mcu]
# TODO: ls /dev/serial/by-id/ on NODE-RPI4-02 after flashing (STM32F446 or STM32F429, see README.md)
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_REPLACE_WITH_ID-if00

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 500
max_z_velocity: 1
max_z_accel: 1
square_corner_velocity: 5

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40         # TODO: GT2 2 mm pitch x 20T pulley = 40; confirm pulley teeth
# Optical sensor (5V, GND, signal). TODO: run QUERY_ENDSTOPS with the flag in/out; add or remove "!"
endstop_pin: ^PG6
position_endstop: 0
position_max: 200             # TODO: measured travel of the model
homing_speed: 20
homing_retract_dist: 3

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40         # TODO: as X
endstop_pin: ^PG9             # TODO: as X
position_endstop: 0
position_max: 200             # TODO: measured travel of the model
homing_speed: 20
homing_retract_dist: 3

[stepper_z]
# Placeholder only: MOTOR2 slot, nothing connected. Never home Z (see [homing_override]).
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0
position_max: 1

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.600            # TODO: NEMA17 rating; start low, raise only if steps are lost
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.600
stealthchop_threshold: 999999

[homing_override]
axes: xy
set_position_z: 0
gcode:
  G28 X
  G28 Y

[idle_timeout]
timeout: 600

[gcode_macro MOVE_DOLL]
description: Move the doll to X,Y (mm). Example: MOVE_DOLL X=80 Y=40
gcode:
  {% set x = params.X|default(0)|float %}
  {% set y = params.Y|default(0)|float %}
  {% set f = params.F|default(3000)|float %}
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G0 X{x} Y{y} F{f}

[gcode_macro PARK_DOLL]
gcode:
  MOVE_DOLL X=0 Y=0
