# CTRL-OCTOPUS-01 (BTT Octopus V1.1 + Klipper on NODE-RPI4-02). Variant B: macros/scripts only.
# Same pins as printer-cartesian.cfg (electrical-harness-plan.md). X and Y are independent
# manual_steppers with their own optical home sensors; no fake Z axis. Plain G0/G1 moves do not
# work in this variant: use DOLL_HOME / DOLL_MOVE (or MANUAL_STEPPER from a script via Moonraker).
#
# VALUES TO CONFIRM ON THE MODEL (TODO): MCU serial id, endstop polarity, travel, rotation_distance,
# motor current. The BOM marks the GT2 belt "not purchased".

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_REPLACE_WITH_ID-if00

[printer]
kinematics: none
max_velocity: 100
max_accel: 500

[manual_stepper doll_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40         # TODO: GT2 x 20T
velocity: 50
accel: 300
endstop_pin: ^PG6             # TODO: polarity via QUERY_ENDSTOPS
position_min: 0
position_max: 200             # TODO: measured travel

[manual_stepper doll_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
velocity: 50
accel: 300
endstop_pin: ^PG9
position_min: 0
position_max: 200

[tmc2209 manual_stepper doll_x]
uart_pin: PC4
run_current: 0.600
stealthchop_threshold: 999999

[tmc2209 manual_stepper doll_y]
uart_pin: PD11
run_current: 0.600
stealthchop_threshold: 999999

[idle_timeout]
timeout: 600

[gcode_macro DOLL_HOME]
description: Home both axes on the optical sensors (moves towards 0 until the sensor triggers)
gcode:
  MANUAL_STEPPER STEPPER=doll_x ENABLE=1
  MANUAL_STEPPER STEPPER=doll_y ENABLE=1
  # Assume the far end, seek 0 until the optical sensor triggers (position limits stay 0..200)
  MANUAL_STEPPER STEPPER=doll_x SET_POSITION=200
  MANUAL_STEPPER STEPPER=doll_x MOVE=0 STOP_ON_ENDSTOP=1
  MANUAL_STEPPER STEPPER=doll_x SET_POSITION=0
  MANUAL_STEPPER STEPPER=doll_y SET_POSITION=200
  MANUAL_STEPPER STEPPER=doll_y MOVE=0 STOP_ON_ENDSTOP=1
  MANUAL_STEPPER STEPPER=doll_y SET_POSITION=0
  SET_GCODE_VARIABLE MACRO=DOLL_MOVE VARIABLE=homed VALUE=1

[gcode_macro DOLL_MOVE]
description: Move the doll to X,Y (mm), homing first if needed. Example: DOLL_MOVE X=80 Y=40
variable_homed: 0
gcode:
  {% if not homed %}
    DOLL_HOME
  {% endif %}
  {% set x = params.X|default(0)|float %}
  {% set y = params.Y|default(0)|float %}
  {% set v = params.SPEED|default(40)|float %}
  MANUAL_STEPPER STEPPER=doll_x MOVE={x} SPEED={v} SYNC=0
  MANUAL_STEPPER STEPPER=doll_y MOVE={y} SPEED={v}
