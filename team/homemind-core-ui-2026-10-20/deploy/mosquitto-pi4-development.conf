per_listener_settings true

# Direct PC-to-Pi4 development cable. This listener is not routed to Wi-Fi.
listener 1883 10.10.10.2
allow_anonymous true

# Flutter browser preview. MQTT over WebSocket is required by web browsers.
listener 9001 10.10.10.2
protocol websockets
allow_anonymous true

# ESP32/Pi5 Wi-Fi listener. Authentication remains mandatory.
listener 1884 0.0.0.0
allow_anonymous false
password_file /data/share/homemind/config/mosquitto.passwd
# 0.6.0: enable after mosquitto.passwd usernames are the node IDs in mosquitto.acl
#acl_file /data/share/homemind/config/mosquitto.acl

persistence false
log_dest stdout
log_type all

# Ports 1883 and 9001 remain isolated cable-only development listeners.
# Wi-Fi devices use authenticated MQTT TCP port 1884.
