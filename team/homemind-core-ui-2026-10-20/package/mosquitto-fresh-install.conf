per_listener_settings true

# Safe first-install listener: isolated PC/Pi cable only.
listener 1883 10.10.10.2
allow_anonymous true

# Flutter web preview over the isolated PC/Pi cable.
listener 9001 10.10.10.2
protocol websockets
allow_anonymous true

# Configure an authenticated Wi-Fi listener separately before ESP32 deployment.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
