[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homemind-runtime"
version = "0.1.0"
description = "HomeMind demo runtime: connects the PC reference AI services to the pfn.v1 MQTT contracts"
requires-python = ">=3.10,<3.13"
dependencies = ["paho-mqtt>=2.1,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
homemind-runtime = "homemind_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
