[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homemind-context-fusion"
version = "0.1.0"
description = "Privacy-minimized audio, vision, and device-state context fusion for HomeMind"
requires-python = ">=3.10,<3.13"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
homemind-context-fusion = "homemind_context_fusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
