[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homemind-audio-context"
version = "0.1.0"
description = "YAMNet-based audio context and sound event baseline for HomeMind TaskFlow"
requires-python = ">=3.10,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<2.1",
  # joblib model bundles are not guaranteed to be portable across sklearn versions.
  # v3/v4 production candidates were trained with this exact release.
  "scikit-learn==1.7.2",
  "scipy>=1.13,<2",
  "setuptools>=75,<81",
  "sounddevice>=0.5,<0.6",
  "soundfile>=0.12,<0.14",
  "tensorflow>=2.16,<2.21",
  "tensorflow-hub>=0.16,<0.17"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
homemind-audio = "homemind_audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
