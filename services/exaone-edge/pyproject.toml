[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homemind-exaone-edge"
version = "0.1.0"
description = "Validated llama.cpp Task JSON proposals for HomeMind"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
homemind-exaone = "homemind_exaone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
